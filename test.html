<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .nav-btn {
            text-align: center;
        }

        .tf-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 40px;
            background-color: #ffffff;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 2px solid #ffffff;
        }

        .tf-btn:hover {
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
        }

        .icon-arrow-right::before {
            content: "→";
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Slide */
        .quote-modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background: linear-gradient(135deg, #1a4d3e 0%, #0f3d2f 100%);
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.4s ease;
            z-index: 1000;
            padding: 40px 30px;
        }

        .quote-modal.active {
            transform: translateX(0);
        }

        .modal-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title-text {
            font-size: 24px;
            color: #ffffff;
            font-weight: 600;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #ffffff;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #a0d8c9;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #a0d8c9;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .modal-heading {
            font-size: 32px;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #a0d8c9;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(160, 216, 201, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .form-select option {
            background-color: #1a4d3e;
            color: #ffffff;
        }

        .form-select:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #a0d8c9;
            box-shadow: 0 0 0 3px rgba(160, 216, 201, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px 30px;
            background-color: rgba(160, 216, 201, 0.2);
            color: #ffffff;
            border: 2px solid #a0d8c9;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: #a0d8c9;
            color: #1a4d3e;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .quote-modal {
                max-width: 100%;
                padding: 30px 20px;
            }

            .modal-heading {
                font-size: 24px;
                margin-bottom: 30px;
            }

            .modal-title-text {
                font-size: 20px;
            }

            .form-group {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .quote-modal {
                padding: 20px 15px;
            }

            .modal-heading {
                font-size: 20px;
            }

            .form-control,
            .form-select {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Quote Button -->
    <div class="nav-btn">
        <a href="#" class="tf-btn" id="quoteBtn">
            <span>Get A Quote</span>
            <i class="icon-arrow-right"></i>
        </a>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Quote Modal -->
    <div class="quote-modal" id="quoteModal">
        <!-- Close Button -->
        <div class="modal-header-top">
            <div></div>
            <button class="close-btn" id="closeBtn">×</button>
        </div>

        <!-- Modal Content -->
        <div class="modal-subtitle">LET'S CHAT</div>
        <div class="modal-heading">READY TO DISCUSS YOUR PROJECT?</div>

        <!-- Form -->
        <form id="quoteForm">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Your Email" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" class="form-control" id="phone" placeholder="Your Phone" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="service">Enquired Service / Product</label>
                        <select class="form-select" id="service" required>
                            <option value="">Select Service</option>
                            <option value="web-design">Web Design</option>
                            <option value="web-dev">Web Development</option>
                            <option value="mobile-app">Mobile App</option>
                            <option value="branding">Branding</option>
                            <option value="seo">SEO</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea class="form-control" id="message" placeholder="Tell us about your project..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        const quoteBtn = document.getElementById('quoteBtn');
        const closeBtn = document.getElementById('closeBtn');
        const quoteModal = document.getElementById('quoteModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const quoteForm = document.getElementById('quoteForm');

        // Open Modal
        quoteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            quoteModal.classList.add('active');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        // Close Modal
        const closeModal = () => {
            quoteModal.classList.remove('active');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        };

        closeBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', closeModal);

        // Close on Escape Key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && quoteModal.classList.contains('active')) {
                closeModal();
            }
        });

        // Form Submit
        quoteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Form submitted! This is a demo.');
            quoteForm.reset();
            closeModal();
        });
    </script>
</body>
</html>
